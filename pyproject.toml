[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fusion-safety-agent"
version = "1.0.1"
description = "Multi-sensor trajectory-risk and longitudinal-safety Agent for CARLA"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10,<2",
  "opencv-python>=4.8,<5",
]

[project.scripts]
fusion-safety = "fusion_tracking_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
  "fusion_tracking_agent*",
  "fusion_tracking_bevfusion*",
  "fusion_tracking_carla*",
  "fusion_tracking_core*",
]
exclude = ["experiments*", "tests*", "tools*", "archive*", "third_party*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
